name: Build
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'ci: repair crypto audit push')"
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.artifacts.outputs.release_name }}
      debug_name: ${{ steps.artifacts.outputs.debug_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Cache Rust artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            native-certgen/target
          key: rust-${{ runner.os }}-${{ hashFiles('native-certgen/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}
            ccache-${{ runner.os }}-
            ccache-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest -Dorg.gradle.jvmargs=-Xmx2048m
      - name: Build with Gradle
        run: ./gradlew zipRelease zipDebug -Porg.gradle.parallel=true -Porg.gradle.vfs.watch=true -Dorg.gradle.jvmargs=-Xmx2048m
      - name: List build artifacts
        id: artifacts
        run: |
          release="$(ls out/*Release*.zip | head -1)"
          debug="$(ls out/*Debug*.zip | head -1)"
          test -n "$release" && test -n "$debug"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "debug=$debug" >> "$GITHUB_OUTPUT"
          echo "release_name=$(basename "$release")" >> "$GITHUB_OUTPUT"
          echo "debug_name=$(basename "$debug")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifacts.outputs.release }}
          retention-days: 30
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifacts.outputs.debug }}
          retention-days: 7
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: release-mappings
          path: app/build/outputs/mapping/release
          retention-days: 30
          compression-level: 9
  release:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: ver
        env:
          RELEASE_NAME: ${{ needs.build.outputs.release_name }}
        run: |
          case "$RELEASE_NAME" in
            TEESimulator-RS-v*-Release.zip) ;;
            *) echo "Unexpected release filename: $RELEASE_NAME" >&2; exit 1 ;;
          esac
          version="${RELEASE_NAME#TEESimulator-RS-}"
          version="${version%-Release.zip}"
          count="${version##*-}"
          [[ "$count" =~ ^[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$count" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.release_name }}
          path: zips
          skip-decompress: true
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.debug_name }}
          path: zips
          skip-decompress: true
      - name: Verify module zips
        run: |
          ls -la zips/
          test -f "zips/${{ needs.build.outputs.release_name }}"
          test -f "zips/${{ needs.build.outputs.debug_name }}"
      - name: Extract latest changelog section
        run: |
          awk '/^## TEESimulator-RS v/{if(flag) exit; flag=1; next} flag' module/changelog.md > /tmp/notes.md
          test -s /tmp/notes.md
          cat /tmp/notes.md
      - name: Create release
        env:
          VER: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$VER" --yes 2>/dev/null || true
          gh release create "$VER" --title "$VER" --latest --notes-file /tmp/notes.md "zips/${{ needs.build.outputs.release_name }}" "zips/${{ needs.build.outputs.debug_name }}"
      - name: Bump update.json
        env:
          VER: ${{ steps.ver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT="${{ steps.ver.outputs.version_code }}"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${VER}/${{ needs.build.outputs.release_name }}"
          CHANGELOG="https://raw.githubusercontent.com/${{ github.repository }}/main/module/changelog.md"
          jq --arg version "$VER" --argjson count "$COUNT" --arg url "$ZIP_URL" --arg changelog "$CHANGELOG" '.version = $version | .versionCode = $count | .zipUrl = $url | .changelog = $changelog' module/update.json > /tmp/update.json
          mv /tmp/update.json module/update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/update.json
          git diff --cached --quiet || {
            git commit -m "chore(release): bump update.json to $VER [skip ci]"
            git push origin HEAD:main
          }
